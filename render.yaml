services:
  - type: web
    name: validity-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: validity-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: none
      - key: SESSION_DRIVER
        value: database
      - key: LOG_CHANNEL
        value: stderr
    disk:
      name: validity-storage
      mountPath: /var/www/html/storage/app
      sizeGB: 1

databases:
  - name: validity-db
    databaseName: validity
    plan: basic-256mb
